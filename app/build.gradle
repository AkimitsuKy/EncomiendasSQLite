plugins {
    id 'com.android.application'
}

android {
    namespace 'co.edu.unipiloto.encomiendas'
    compileSdk 34

    defaultConfig {
        applicationId "co.edu.unipiloto.encomiendas"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
